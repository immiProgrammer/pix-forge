name: Windows installers

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Test native engine
        shell: pwsh
        run: |
          . ./scripts/windows-env.ps1
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed.' }
      - name: Build EXE and MSI installers
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Bundle all -Locked
      - name: Verify both installer types
        shell: pwsh
        run: |
          $bundle = 'apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $exe = @(Get-ChildItem "$bundle/nsis/*.exe")
          $msi = @(Get-ChildItem "$bundle/msi/*.msi")
          if ($exe.Count -ne 1 -or $msi.Count -ne 1) { throw 'Expected one EXE and one MSI installer.' }
      - name: Upload test installers
        uses: actions/upload-artifact@v4
        with:
          name: pixforge-windows-x64-test
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
