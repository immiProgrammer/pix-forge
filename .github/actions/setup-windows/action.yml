name: Set up Windows native build
description: Configure Node, Rust, MSVC codec dependencies, NASM, and installer prerequisites.
inputs:
  vcpkg-commit:
    description: Pinned vcpkg revision for dav1d and pkgconf
    default: 0c2a9ace1964b818b15f7ae50ba1c42404918a7b
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Configure native dependency paths
      shell: pwsh
      run: |
        "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
        "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP\vcpkg-cache,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Append

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/desktop/src-tauri -> target
        key: windows-x64

    - name: Restore native codec build cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/vcpkg-cache
        key: windows-2022-codecs-${{ inputs.vcpkg-commit }}-${{ hashFiles('scripts/windows-env.ps1') }}

    - name: Install NASM and check MSI prerequisites
      shell: pwsh
      run: |
        if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed.' }
        }
        $nasmDirectory = Join-Path $env:ProgramFiles 'NASM'
        if (Test-Path (Join-Path $nasmDirectory 'nasm.exe')) {
          $nasmDirectory | Out-File -FilePath $env:GITHUB_PATH -Append
        }
        $vbscript = Get-WindowsCapability -Online | Where-Object Name -Like 'VBSCRIPT*'
        foreach ($capability in $vbscript) {
          if ($capability.State -ne 'Installed') {
            $result = Add-WindowsCapability -Online -Name $capability.Name
            if ($result.RestartNeeded) { throw 'VBScript requires a runner restart; use a runner image with it enabled.' }
          }
        }

    - name: Install static AVIF decoder and pkgconf
      shell: pwsh
      env:
        VCPKG_COMMIT: ${{ inputs.vcpkg-commit }}
      run: |
        if ($env:VCPKG_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Expected a full pinned vcpkg commit SHA.' }
        New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\vcpkg-cache" -Force | Out-Null
        git init $env:VCPKG_ROOT
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg initialization failed.' }
        git -C $env:VCPKG_ROOT remote add origin https://github.com/microsoft/vcpkg.git
        git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_COMMIT
        if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the pinned vcpkg revision.' }
        git -C $env:VCPKG_ROOT checkout --detach FETCH_HEAD
        if ($LASTEXITCODE -ne 0) { throw 'Could not check out vcpkg.' }
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
        & "$env:VCPKG_ROOT\vcpkg.exe" install dav1d:x64-windows-static-md pkgconf:x64-windows-static-md
        if ($LASTEXITCODE -ne 0) { throw 'Native codec installation failed.' }
